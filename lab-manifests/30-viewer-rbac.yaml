apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding                     # a RoleBinding...
metadata:
  name: viewer-binding
subjects:
  - kind: ServiceAccount
    name: viewer-sa
    namespace: multi-service-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole                   # ...pointing at a built-in ClusterRole
  name: view
