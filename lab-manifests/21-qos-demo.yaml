apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh","-c","sleep 600"]
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits:   { cpu: 50m, memory: 32Mi }   # identical to requests
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh","-c","sleep 600"]
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits:   { memory: 128Mi }             # limit higher than request
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh","-c","sleep 600"]          # nothing declared
